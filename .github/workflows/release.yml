name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch and verify winws binaries
        run: scripts/fetch-bin.sh

      - name: Build
        run: make dist VERSION=${{ github.ref_name }}

      - name: Checksum
        working-directory: dist
        run: sha256sum nova-${{ github.ref_name }}.zip > nova-${{ github.ref_name }}.zip.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/nova-${{ github.ref_name }}.zip \
            dist/nova-${{ github.ref_name }}.zip.sha256 \
            --title "nova ${{ github.ref_name }}" \
            --notes-file .github/release-notes.md \
            --generate-notes
